<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body style="background-color: grey; color: antiquewhite;">
    <h1>Events in Javascript</h1>
    <button id="stop">Stop</button>
</body>
<script>

    // print something after 2 sec. time given in millisec. + executes only once after the given time, does not repeat again & again
    // setTimeout(function(){
    //     console.log("Something");
    // },2000)

    //another way to do it:
    // const saySomething = function(){
    //     console.log("Something");
    // }
    // setTimeout(saySomething,2000) // do not run/execute the function, just give the reference.

    const changeName = function(){
        document.querySelector('h1').innerHTML = 'Let\'s crack JavaScript'
    }
    const name = setTimeout(changeName,2000)

    // to stop the event from happening before time on clicking button
    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(name) // reference of the timeout set
        console.log("Stopped");
        
    })
</script>
</html>
