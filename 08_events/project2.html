<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events 2</title>
</head>
<body style="background-color: grey; color: antiquewhite;">
    <h1>Events in Javascript with water</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>

    let timer = null
    
    const dateFun = function(str){
        const readableTime = new Date(Date.now()).toLocaleString();
        console.log(str, readableTime);
    }


    document.getElementById('start').addEventListener('click', function(){
        if (!timer) {
            timer = setInterval(dateFun,1000,"Time is ticking")
        }
    })
    
    document.getElementById('stop').addEventListener('click', function(){
        clearInterval(timer)
        timer = null;
        console.log("Time over");
        
    })

</script>
</html>
